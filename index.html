<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>珠靈殿停車管理系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    body { font-family: sans-serif; padding: 10px; background-color: #f4f4f9; margin: 0; }
    #auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; padding: 20px; }
    #main-app { display: none; }

    /* --- 通用樣式 --- */
    .header-nav { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
    .nav-btn { background-color: #4CAF50; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 22px; cursor: pointer; margin: 0 10px; }
    .btn { padding: 15px; border: none; border-radius: 8px; font-size: 20px; cursor: pointer; font-weight: bold; }
    .btn-save { background-color: #007bff; color: white; flex-grow: 1; margin-right: 10px; }
    .btn-leave { background-color: #dc3545; color: white; display: none; }
    .btn-cancel { background-color: #6c757d; color: white; margin-left: 10px; }

    /* --- 表格區塊 --- */
    .grid-container { display: grid; grid-template-columns: repeat(1, 1fr); gap: 15px; margin-top: 10px; }
    .parking-space { padding: 0; text-align: center; border-radius: 12px; font-weight: bold; cursor: pointer; border: 2px solid #ccc; box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: transform 0.1s; overflow: hidden; }
    .status-empty { background-color: #e9ecef; color: #6c757d; border-color: #ced4da; } 
    .status-unpaid { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; } 
    .status-paid { background-color: #d4edda; color: #155724; border-color: #c3e6cb; } 
    .space-layout { display: flex; height: 100%; min-height: 110px; }
    .space-id { width: 25%; display: flex; align-items: center; justify-content: center; font-size: 40px; border-right: 2px solid rgba(0,0,0,0.15); }
    .space-info { width: 75%; display: flex; flex-direction: column; overflow: hidden; }
    .space-row-top { display: flex; justify-content: space-evenly; align-items: center; padding: 4px 6px; border-bottom: 2px solid rgba(0,0,0,0.15); flex: 1; white-space: nowrap; overflow: hidden; }
    .space-row-middle { display: flex; justify-content: center; align-items: center; padding: 4px 6px; font-size: 21px; border-bottom: 2px solid rgba(0,0,0,0.15); flex: 1; white-space: nowrap; overflow: hidden; }
    .space-row-bottom { display: flex; justify-content: center; align-items: center; padding: 4px 6px; font-size: 21px; flex: 1; white-space: nowrap; overflow: hidden; }
    .info-name { font-size: 26px; font-weight: bold; }
    .info-plate { font-size: 26px; opacity: 0.8; margin-left: 26px; text-overflow: ellipsis; }
    .badge-amount { font-weight: bold; font-size: 20px; }
    .badge-time { margin-left: 8px; font-size: 16px; color: #555; }
    .badge-note { margin-left: 8px; font-size: 20px; }
    .phone-link { color: inherit; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 4px; cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

    @media (min-width: 768px) {
      .grid-container { grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 15px; }
      .space-layout { min-height: 95px; }
      .space-id { font-size: 26px; border-right: 1px solid rgba(0,0,0,0.15); }
      .info-name { font-size: 24px; }
      .info-plate { font-size: 24px; margin-left: 6px; }
      .space-row-middle { font-size: 16px; padding: 3px; border-bottom: 1px solid rgba(0,0,0,0.15); }
      .space-row-bottom { font-size: 16px; padding: 3px; }
      .space-row-top { border-bottom: 1px solid rgba(0,0,0,0.15); padding: 3px; }
      .parking-space { border-width: 1px; border-radius: 8px; }
    }

    .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); overflow-y: auto; }
    .modal-content { background-color: #fff; margin: 10% auto; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; }
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; font-size: 20px; margin-bottom: 8px; font-weight: bold;}
    .input-group select, .input-group input { width: 100%; padding: 14px; border: 2px solid #ccc; border-radius: 8px; font-size: 24px; font-weight: bold; }

    #status-msg { text-align: center; color: #666; margin-bottom: 10px; font-weight: bold; font-size: 18px; }

    /* --- 🌟 最終版 PDF 樣式結界 🌟 --- */
    #pdf-export-area { position: absolute; left: -9999px; top: 0; font-family: "BiauKai", "標楷體", serif !important; font-weight: bold !important; }
    
    .pdf-page-map { position: relative; width: 286mm; height: 196mm; box-sizing: border-box; background-color: #fff; overflow: hidden; page-break-after: always; margin: 0 auto; }
    .pdf-page-map:last-child { page-break-after: auto; }
    .pdf-excel-map { width: calc(100% - 2px); margin: 1px; border-collapse: collapse; text-align: center; table-layout: fixed; }
    .pdf-excel-map td { border: 1.5px solid #000; height: 26px; overflow: hidden; white-space: nowrap; word-break: break-all; font-family: "BiauKai", "標楷體", serif !important; font-weight: bold !important; }
    .pdf-m-id { font-size: 16px; background-color: #fff !important; font-family: Arial, sans-serif !important;}
    .pdf-m-name { font-size: 16px; }
    .pdf-m-text { font-size: 11px; letter-spacing: -0.5px; font-family: Arial, sans-serif !important; }

    .pdf-page-receipts { 
      width: 196mm; height: 284mm; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; 
      page-break-after: always; overflow: hidden; margin: 0 auto;
    }
    .pdf-page-receipts:last-child { page-break-after: auto; }
    .pdf-receipt-card { 
      position: relative; box-sizing: border-box; padding: 10mm;
      border: 1px dashed #999; /* 十字虛線 */
    }
    .receipt-inner { 
      position: absolute; top: 5mm; left: 5mm; right: 5mm; bottom: 5mm;
      display: flex; flex-direction: row-reverse; justify-content: space-between; 
      font-family: "BiauKai", "標楷體", serif !important; font-weight: bold !important;
    }
    .v-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  </style>
</head>
<body>

  <div id="auth-screen"><h1>系統驗證中...</h1></div>
  <div id="main-app">
    <div class="header-nav">
      <button class="nav-btn" onclick="changePeriod(-1)">&#10094;</button>
      <h2 id="period-title">民國 115年 5-6月</h2>
      <button class="nav-btn" onclick="changePeriod(1)">&#10095;</button>
      <button class="print-btn btn-map" style="background-color: #17a2b8; margin: 0 5px;" onclick="downloadMapPDF()">📥 下載總表 (PDF)</button>
      <button class="print-btn btn-receipt" style="background-color: #fd7e14; margin: 0 5px;" onclick="downloadReceiptsPDF()">📥 下載收據 (PDF)</button>
    </div>

    <div id="status-msg">資料載入中，請稍候...</div>
    <div id="parking-grid" class="grid-container"></div>

    <div id="editModal" class="modal">
      <div class="modal-content">
        <h3 id="modal-title">車位編輯</h3>
        <input type="hidden" id="modal-spaceId">
        <div class="input-group">
          <label>客戶姓名：</label>
          <select id="modal-name-select" onchange="handleCustomerSelect()"></select>
          <input type="text" id="modal-name-custom" placeholder="請輸入新客戶姓名" style="display:none; margin-top:8px;">
        </div>
        <div class="input-group"><label>車牌：</label><input type="text" id="modal-plate"></div>
        <div class="input-group"><label>電話：</label><input type="text" id="modal-phone"></div>
        <div class="input-group">
          <label>繳費金額：</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="modal-amount" style="flex: 1;">
            <button type="button" onclick="fillAmountAndTime()" class="btn" style="background: #28a745; color: white;">💰 3600</button>
          </div>
        </div>
        <div class="input-group"><label>繳費時間：</label><input type="text" id="modal-paymentTime"></div>
        <div class="input-group"><label>備註：</label><input type="text" id="modal-note"></div>
        <div class="btn-row">
          <button class="btn btn-save" onclick="saveData()">儲存</button>
          <button class="btn btn-leave" id="btn-leave" onclick="leaveSpace()">退租</button>
          <button class="btn btn-cancel" onclick="closeModal()">取消</button>
        </div>
      </div>
    </div>

    <div id="copyModal" class="modal">
      <div class="modal-content" style="max-width: 350px;">
        <h3 style="color: #007bff; font-size: 28px;">💡 系統提示</h3>
        <p style="font-size: 22px; text-align: center; font-weight: bold; line-height: 1.6; margin: 25px 0;">發現這是一個全新月份！<br><span style="color: #dc3545;">是否一鍵匯入上個月的資料？</span></p>
        <div class="btn-row">
          <button class="btn btn-save" onclick="confirmCopy()">確定匯入</button>
          <button class="btn btn-cancel" onclick="closeCopyModal()">先不要</button>
        </div>
      </div>
    </div>
  </div>

  <div id="pdf-export-area"></div>

  <script>
    const MY_LIFF_ID = "2010181007-eMKJGt2N"; 
    const MY_GAS_URL = "https://script.google.com/macros/s/AKfycbwyi2lv8MR-FHMGWQurAWNpg0l7XbGCh_ySgijb9cxUboiqdSiiPhUE4nX5eFMV4Wniww/exec";

    let currentYear = 115;
    let currentMonth = 5; 
    let globalCustomers = []; 
    let globalSpaces = []; 
    let globalUserRole = "none"; 
    let globalUserId = ""; 

    function getPeriodString() { return `${currentYear}_${currentMonth}-${currentMonth+1}`; }
    function isLineBrowser() { return /Line/i.test(navigator.userAgent); }

    function fillAmountAndTime() {
        document.getElementById('modal-amount').value = '3600';
        let now = new Date();
        let pad = (num) => String(num).padStart(2, '0');
        let timeStr = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
        document.getElementById('modal-paymentTime').value = timeStr;
    }

    async function initAuth() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        const profile = await liff.getProfile();
        globalUserId = profile.userId; 
        const response = await fetch(MY_GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'login', uid: globalUserId }) });
        const result = await response.json();
        if (result.role === 'admin' || result.role === 'viewer') {
           globalUserRole = result.role;
           document.getElementById('auth-screen').style.display = 'none';
           document.getElementById('main-app').style.display = 'block';
           loadData(); 
        } else {
           document.getElementById('auth-screen').innerHTML = `<h1>⛔ 無存取權限</h1><p>ID: ${globalUserId}</p>`;
        }
      } catch (err) {}
    }

    function changePeriod(direction) {
      currentMonth += direction * 2;
      if (currentMonth > 11) { currentMonth = 1; currentYear++; } 
      else if (currentMonth < 1) { currentMonth = 11; currentYear--; }
      document.getElementById('period-title').innerText = `民國 ${currentYear}年 ${currentMonth}-${currentMonth+1}月`;
      loadData(); 
    }

    async function loadData() {
      document.getElementById('status-msg').style.display = 'block';
      const response = await fetch(`${MY_GAS_URL}?period=${getPeriodString()}`);
      const payload = await response.json(); 
      globalCustomers = payload.customers; globalSpaces = payload.spaces; 
      renderGrid(globalSpaces);          
      if (payload.isNewSheet && globalUserRole === 'admin') {
          let pM = currentMonth - 2; let pY = currentYear;
          if (pM < 1) { pM = 11; pY--; }
          pendingTargetPeriod = getPeriodString(); pendingSourcePeriod = `${pY}_${pM}-${pM+1}`;
          document.getElementById('copyModal').style.display = 'block';
      }
    }

    function closeCopyModal() { document.getElementById('copyModal').style.display = 'none'; }
    function confirmCopy() { closeCopyModal(); copyPreviousData(pendingTargetPeriod, pendingSourcePeriod); }

    async function copyPreviousData(targetPeriod, sourcePeriod) {
        document.getElementById('status-msg').innerText = "資料匯入中...";
        var payload = { action: 'copy_period', targetPeriod: targetPeriod, sourcePeriod: sourcePeriod, uid: globalUserId };
        const response = await fetch(MY_GAS_URL, { redirect: "follow", method: 'POST', body: JSON.stringify(payload) });
        const result = await response.json();
        if(result.status === 'success') { alert(result.msg); loadData(); } else { alert("錯誤：" + result.msg); }
    }

    function renderGrid(data) {
      const grid = document.getElementById('parking-grid');
      grid.innerHTML = ''; 
      data.forEach(space => {
        const div = document.createElement('div');
        div.className = 'parking-space';
        if (space.Status === "空位" || space.Status === "") {
          div.classList.add('status-empty');
          div.innerHTML = `<div class="space-layout"><div class="space-id">${space.SpaceID}</div><div class="space-info" style="justify-content: center;"><span style="font-size: 26px; color: #888;">空位</span></div></div>`;
        } else {
          var isPaid = space.Amount && space.Amount.toString().trim() !== "";
          div.classList.add(isPaid ? 'status-paid' : 'status-unpaid');
          var displayPhone = space.Phone ? `<a href="tel:${space.Phone}" class="phone-link" onclick="event.stopPropagation();">${space.Phone}</a>` : "無電話";
          var displayAmount = isPaid ? `<span class="badge-amount" style="color: #155724;">$${space.Amount}</span>` : `<span class="badge-amount" style="color: #dc3545;">(未繳費)</span>`;
          var displayTime = (isPaid && space.PaymentTime) ? `<span class="badge-time">🕒 ${space.PaymentTime}</span>` : "";
          
          div.innerHTML = `
            <div class="space-layout">
              <div class="space-id">${space.SpaceID}</div>
              <div class="space-info">
                <div class="space-row-top"><span class="info-name">${space.Name || "未填寫"}</span><span class="info-plate">${space.LicensePlate || "無車牌"}</span></div>
                <div class="space-row-middle">${displayPhone}${space.Note ? '📝' : ''}</div>
                <div class="space-row-bottom">${displayAmount}${displayTime}</div>
              </div>
            </div>`;
        }
        div.onclick = function() { openModal(space); };
        grid.appendChild(div);
      });
      document.getElementById('status-msg').style.display = 'none';
    }

    function toChineseAmt(numStr) {
        if (!numStr) return '';
        let str = numStr.toString().trim();
        const zh = ['零','壹','貳','參','肆','伍','陸','柒','捌','玖'];
        const unit = ['','拾','佰','仟','萬'];
        let res = '';
        for(let i=0; i<str.length; i++) {
            let n = parseInt(str[i]); let u = str.length - 1 - i;
            if (!isNaN(n)) res += zh[n] + unit[u];
        }
        return res;
    }

    // 🌟 核心：強制所有字串與空位渲染邏輯 🌟
    function buildReceiptsHTML() {
        let html = '';
        // 抓取所有車位 (包含空位)。如果還沒有資料則給定一組空白模板
        let validSpaces = globalSpaces.length > 0 ? globalSpaces : [{SpaceID: '', Name: '', Amount: '', Status: '空位'}]; 
        let totalReceipts = Math.ceil(validSpaces.length / 4) * 4;
        
        let getVertChBold = (str) => {
            if (!str) return '';
            return String(str).split('').map(c => `<span style="display:block; line-height:1.2; font-weight:900 !important;">${c}</span>`).join('');
        };

        for (let i = 0; i < totalReceipts; i += 4) {
            html += `<div class="pdf-page-receipts">`;
            for (let j = 0; j < 4; j++) {
                let space = validSpaces[i + j] || { SpaceID: '', Name: '', Amount: '', Status: '空位' };
                
                // 判斷是否為空位 (未出租)
                let isUnrented = (!space.Name || space.Name.toString().trim() === '' || space.Status === '空位');
                
                let nameToPrint = isUnrented ? '' : space.Name;
                
                // 判斷列印金額
                let amtToPrint = '';
                if (!isUnrented) {
                    if (space.Amount && space.Amount.toString().trim() !== '') {
                        amtToPrint = toChineseAmt(space.Amount);
                    } else {
                        amtToPrint = '參仟陸佰'; // 已出租但未繳費，預印3600
                    }
                }
                
                // 未出租空位不印金額，但塞入隱形字撐開排版
                let vertAmtHtml = amtToPrint !== '' ? getVertChBold(amtToPrint) : `<div style="visibility:hidden; font-weight:900 !important;">${getVertChBold('參仟陸佰')}</div>`;
                
                html += `
                <div class="pdf-receipt-card">
                  <div class="receipt-inner">
                    <div class="v-col" style="width: 10%; font-size: 22px;">${getVertChBold('茲收到')}</div>

                    <div class="v-col" style="width: 18%;">
                        <div style="font-size: 26px; margin-bottom: 10px; min-height: 70px;">${getVertChBold(nameToPrint)}</div>
                        <div style="font-size: 18px; margin-bottom: 8px;">${getVertChBold('君承租本殿停車場')}</div>
                        
                        <div style="font-size: 18px; font-family: Arial; font-weight: 900 !important;">${currentYear}</div>
                        <div style="font-size: 16px; margin-bottom: 4px;">${getVertChBold('年')}</div>
                        <div style="font-size: 36px; font-family: Arial; font-weight: 900 !important; margin: 4px 0;">${currentMonth}~${currentMonth+1}</div>
                        <div style="font-size: 18px;">${getVertChBold('月份')}</div>
                    </div>

                    <div class="v-col" style="width: 22%;">
                        <div style="font-size: ${(String(space.SpaceID).length > 2 ? '45px' : '75px')}; font-family: Arial; font-weight: 900 !important; margin-bottom: 15px;">${space.SpaceID}</div>
                        <div style="font-size: 18px;">${getVertChBold('號車位之清潔費')}</div>
                    </div>

                    <div class="v-col" style="width: 15%;">
                        <div style="font-size: 18px;">${getVertChBold('新台幣')}</div>
                        <div style="font-size: 28px; margin: 20px 0;">${vertAmtHtml}</div>
                        <div style="font-size: 18px;">${getVertChBold('元整')}</div>
                    </div>

                    <div class="v-col" style="width: 12%;">
                        <div style="font-size: 22px; margin-bottom: 30px;">${getVertChBold('此據')}</div>
                        <div style="font-size: 20px;">${getVertChBold('珠靈殿管理委員會')}</div>
                    </div>

                    <div class="v-col" style="width: 10%; justify-content: space-between; height: 100%; padding: 10px 0;">
                        <div style="font-size: 18px;">${getVertChBold('中華民國')}</div>
                        <div style="font-size: 18px;">${getVertChBold('年')}</div>
                        <div style="font-size: 18px;">${getVertChBold('月')}</div>
                        <div style="font-size: 18px;">${getVertChBold('日')}</div>
                    </div>
                  </div>
                </div>`;
            }
            html += `</div>`;
        }
        return html;
    }

    function downloadMapPDF() {
        if (!globalSpaces || globalSpaces.length === 0) { alert("⚠️ 資料尚未載入完成！"); return; }
        if (isLineBrowser()) { alert("⚠️ 請使用外部瀏覽器下載 PDF！"); return; }
        
        document.getElementById('status-msg').style.display = 'block';
        document.getElementById('status-msg').innerText = "📄 PDF 產生中...";

        // 生成總表 HTML...
        const topIds = ['15','13','12','11','10','9','8','7','6','5','3','2','1'];
        const botIdsRow1 = ['16','17','18','19','20','21','22','23','25','26'];
        const botIdsRow2 = ['37','36','35','33','32','31','30','29','28','27'];
        const rightIds = ['39-2', '39-1', '39', '38'];
        let getSpace = (id) => {
            let s = globalSpaces.find(x => x.SpaceID == id);
            return s && s.Name ? { id: s.SpaceID, name: s.Name, plate: s.LicensePlate||'', phone: s.Phone||'' } : { id: id, name: '', plate: '', phone: '' };
        };

        let mapHtml = `<div class="pdf-page-map">
            <div style="position:absolute; top:2%; width:100%; text-align:center; font-size:36px; font-weight:bold; letter-spacing:6px;">
                民國 <span style="font-family:Arial;">115</span> 年 <span style="font-family:Arial;">${currentMonth}~${currentMonth+1}</span> 月份
            </div>
            <div style="position:absolute; top:16%; left:0.5%; width:99%;">
                <table class="pdf-excel-map">
                    <tr>${topIds.map(id => `<td class="pdf-m-id">${id}</td>`).join('')}</tr>
                    <tr>${topIds.map(id => `<td class="pdf-m-name">${getSpace(id).name}</td>`).join('')}</tr>
                    <tr>${topIds.map(id => `<td class="pdf-m-text">${getSpace(id).plate}</td>`).join('')}</tr>
                    <tr>${topIds.map(id => `<td class="pdf-m-text">${getSpace(id).phone}</td>`).join('')}</tr>
                    <tr>${topIds.map(id => `<td>&nbsp;</td>`).join('')}</tr>
                </table>
            </div>
            <div style="position:absolute; top:52%; left:0.5%; width:76.15%;">
                <table class="pdf-excel-map">
                    <tr>${botIdsRow1.map(id => `<td class="pdf-m-id">${id}</td>`).join('')}</tr>
                    <tr>${botIdsRow1.map(id => `<td class="pdf-m-name">${getSpace(id).name}</td>`).join('')}</tr>
                    <tr>${botIdsRow1.map(id => `<td class="pdf-m-text">${getSpace(id).plate}</td>`).join('')}</tr>
                    <tr>${botIdsRow1.map(id => `<td class="pdf-m-text">${getSpace(id).phone}</td>`).join('')}</tr>
                    <tr>${botIdsRow1.map(id => `<td>&nbsp;</td>`).join('')}</tr>
                    
                    <tr>${botIdsRow2.map(id => `<td class="pdf-m-id">${id}</td>`).join('')}</tr>
                    <tr>${botIdsRow2.map(id => `<td class="pdf-m-name">${getSpace(id).name}</td>`).join('')}</tr>
                    <tr>${botIdsRow2.map(id => `<td class="pdf-m-text">${getSpace(id).plate}</td>`).join('')}</tr>
                    <tr>${botIdsRow2.map(id => `<td class="pdf-m-text">${getSpace(id).phone}</td>`).join('')}</tr>
                    <tr>${botIdsRow2.map(id => `<td>&nbsp;</td>`).join('')}</tr>
                </table>
            </div>
            <div style="position:absolute; top:52%; right:15px; width:14%;">
                <table class="pdf-excel-map">
                    ${rightIds.map(id => `<tr>
                        <td style="width:65%; text-align:center; padding:2px;">
                            <div class="pdf-m-name" style="margin-bottom:2px;">${getSpace(id).name}</div>
                            <div class="pdf-m-text">${getSpace(id).plate}</div>
                            <div class="pdf-m-text">${getSpace(id).phone}</div>
                        </td><td class="pdf-m-id" style="width:35%; vertical-align:middle;">${id}</td>
                    </tr>`).join('')}
                </table>
            </div>
            <div style="position:absolute; bottom:2%; left:78%; width:8%; text-align:center;">
                <svg width="55" height="35" viewBox="0 0 80 50"><polygon points="40,0 0,50 80,50" fill="white" stroke="black" stroke-width="2"/><text x="40" y="40" font-size="18" text-anchor="middle" font-weight="bold">入口</text></svg>
            </div>
            <div style="position:absolute; bottom:-15px; right:5px; width:12%; text-align:center;">
                <svg width="60" height="80" viewBox="0 0 100 120">
                    <rect x="42" y="90" width="16" height="30" fill="#5c4033" stroke="black" stroke-width="1.5"/>
                    <polygon points="50,0 10,40 90,40" fill="#228B22" stroke="black" stroke-width="1.5"/>
                    <polygon points="50,25 0,70 100,70" fill="#228B22" stroke="black" stroke-width="1.5"/>
                    <polygon points="50,50 -10,100 110,100" fill="#228B22" stroke="black" stroke-width="1.5"/>
                </svg>
            </div>
        </div>`;

        document.getElementById('pdf-export-area').innerHTML = mapHtml;
        html2pdf().set({ margin: 5, filename: `珠靈殿總表_${currentYear}_${currentMonth}-${currentMonth+1}月.pdf`, jsPDF: { format: 'a4', orientation: 'landscape' } }).from(document.getElementById('pdf-export-area').firstElementChild).save().then(() => {
            document.getElementById('status-msg').style.display = 'none';
            document.getElementById('pdf-export-area').innerHTML = '';
        });
    }

    function downloadReceiptsPDF() {
        if (!globalSpaces || globalSpaces.length === 0) { alert("⚠️ 資料尚未載入完成！"); return; }
        if (isLineBrowser()) { alert("⚠️ 請使用外部瀏覽器下載 PDF！"); return; }
        document.getElementById('status-msg').style.display = 'block';
        document.getElementById('status-msg').innerText = "📄 PDF 產生中...";
        let wrapper = document.createElement('div');
        wrapper.innerHTML = buildReceiptsHTML();
        html2pdf().set({ margin: 5, filename: `珠靈殿收據_${currentYear}_${currentMonth}-${currentMonth+1}月.pdf`, jsPDF: { format: 'a4', orientation: 'portrait' } }).from(wrapper).save().then(() => { document.getElementById('status-msg').style.display = 'none'; });
    }

    function openModal(space) {
      document.getElementById('modal-spaceId').value = space.SpaceID;
      document.getElementById('modal-title').innerText = `管理車位：${space.SpaceID} 號`;
      const select = document.getElementById('modal-name-select');
      const customName = document.getElementById('modal-name-custom');
      
      select.innerHTML = '<option value="">-- 請選擇客戶 --</option>';
      globalCustomers.forEach(c => {
         const opt = document.createElement('option');
         opt.value = c.Name; opt.text = c.Name;
         opt.dataset.phone = c.Phone; opt.dataset.plate = c.LicensePlate;
         select.appendChild(opt);
      });
      select.innerHTML += '<option value="NEW">➕ 新增客戶 (手動輸入)</option>';
      customName.style.display = 'none';

      if (space.Status === "空位" || space.Status === "") {
        document.getElementById('btn-leave').style.display = 'none';
        document.getElementById('btn-save').innerText = '確定出租';
        select.value = ""; document.getElementById('modal-phone').value = ""; document.getElementById('modal-plate').value = "";
        document.getElementById('modal-amount').value = "3600";
        document.getElementById('modal-note').value = "";
        document.getElementById('modal-paymentTime').value = "";
      } else {
        document.getElementById('btn-leave').style.display = 'inline-block';
        document.getElementById('btn-save').innerText = '儲存修改';
        let found = false;
        for(let i=0; i<select.options.length; i++) { if(select.options[i].value === space.Name) { select.selectedIndex = i; found = true; break; } }
        if(!found) { select.value = "NEW"; customName.style.display = 'block'; customName.value = space.Name; }
        document.getElementById('modal-phone').value = space.Phone || ""; document.getElementById('modal-plate').value = space.LicensePlate || "";
        document.getElementById('modal-amount').value = space.Amount || "";
        document.getElementById('modal-note').value = space.Note || "";
        document.getElementById('modal-paymentTime').value = space.PaymentTime || "";
      }
      document.getElementById('editModal').style.display = 'block';
    }

    function handleCustomerSelect() {
       const select = document.getElementById('modal-name-select');
       const customName = document.getElementById('modal-name-custom');
       if (select.value === "NEW") { customName.style.display = 'block'; document.getElementById('modal-phone').value = ''; document.getElementById('modal-plate').value = ''; } 
       else if (select.value === "") { customName.style.display = 'none'; document.getElementById('modal-phone').value = ''; document.getElementById('modal-plate').value = ''; } 
       else {
          customName.style.display = 'none';
          const option = select.options[select.selectedIndex];
          document.getElementById('modal-phone').value = option.dataset.phone || ''; document.getElementById('modal-plate').value = option.dataset.plate || '';
       }
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }

    function saveData() {
      var spaceId = document.getElementById('modal-spaceId').value;
      var name = document.getElementById('modal-name-select').value;
      if (name === "NEW") name = document.getElementById('modal-name-custom').value.trim();
      if (!name) { alert("請選擇或輸入姓名！"); return; }
      closeModal();
      sendUpdateRequest(spaceId, 'update', name, document.getElementById('modal-phone').value, document.getElementById('modal-plate').value, document.getElementById('modal-amount').value.trim(), document.getElementById('modal-note').value.trim(), document.getElementById('modal-paymentTime').value.trim());
    }

    function leaveSpace() {
      var spaceId = document.getElementById('modal-spaceId').value;
      if(confirm(`確定要將 ${spaceId} 號車位退租，並清空客戶資料嗎？`)) {
        closeModal(); sendUpdateRequest(spaceId, 'leave', '', '', '', '', '', '');
      }
    }

    async function sendUpdateRequest(spaceId, action, name, phone, plate, amount = '', note = '', paymentTime = '') {
      document.getElementById('status-msg').style.display = 'block';
      document.getElementById('status-msg').innerText = "資料同步中，請稍候...";
      var payload = { action: action, spaceId: spaceId, name: name, phone: phone, plate: plate, amount: amount, note: note, paymentTime: paymentTime, period: getPeriodString(), uid: globalUserId };
      try {
        const response = await fetch(MY_GAS_URL, { redirect: "follow", method: 'POST', body: JSON.stringify(payload) });
        const result = await response.json();
        if(result.status === 'success') { alert(result.msg); loadData(); } 
        else { alert("錯誤：" + result.msg); document.getElementById('status-msg').style.display = 'none'; }
      } catch (err) { alert("連線失敗：" + err); document.getElementById('status-msg').style.display = 'none'; }
    }

    initAuth();
  </script>
</body>
</html>
